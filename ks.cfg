## Kickstart for Unattended ESXi Installation in a environment with no DHCP server

# Accept EULA
vmaccepteula

# Clean up the firstdisk and overwirte VMFS(CAUTION: watchout that will target the very first disk available and wipe it)
install --firstdisk --overwritevmfs

# Set the root password(this is for example purpose only, consider changing it to something secure)
rootpw P@ssword@123

# Keyboard layout can be set by uncommenting the line below but levae it commented if US (Default) is intended
#keyboard US Default

# At the end reboot the host
reboot

# Post Installation and First Boot Sequence Containating Post Install Configuration Steps
%firstboot --interpreter=busybox

# Enable SSH(Un-Comment the two lines below if you intend to enable SSH)
#vim-cmd hostsvc/enable_ssh
#vim-cmd hostsvc/start_ssh

# Enable ESXi Shell(Un-Comment the two lines below if you intend to enable ESXi SHELL)
#vim-cmd hostsvc/enable_esx_shell
#vim-cmd hostsvc/start_esx_shell

# Suppress Shell warning (Optional un-comment based on your requirements)
#esxcli system settings advanced set -o /UserVars/SuppressShellWarning -i 1

# Set NTP(Set the NTP time source by un-commenting the two lines below)
#esxcli system ntp set -s de.pool.ntp.org
#esxcli system ntp set -e 1

# Post-Install Configuration Steps
%post --interpreter=busybox

# Here we can embed the CSV right within this kickstart and you can add any number of rows you want
# each row reqpresents one ESXi host and its properties
# Below are two samples
# FORMAT: hostname, MAC(this is what makes it unique), IP to assign to host(no DHCP required it all static), Subnet mask
# Feel free to add new columns of data as required

cat <<EOF > /vmfs/volumes/datastore1/hosts.csv
HostA,00:0c:29:aa:bb:cc,192.168.1.111,255.255.255.0
HostB,00:0c:29:aa:bb:cd,192.168.1.11,255.255.255.0
# add new row from here
EOF

# Python Script to do real magic
# What it does? 
# It reads the CSV and finds the row maching MAC address within and then sets the following based on the CSV
# 1. Set Hostname
# 2. Set the VLAN
# 3. Configres the Network settings like VLAN, IPv4 settings
# 4. Disables IPv6
# 5. Sets the domain name
# 6. Sets the Default Gateway
# 7. Adds the DNS servers

cat <<EOF > /vmfs/volumes/datastore1/myscript.py
#!/usr/bin/python
import os, csv, subprocess

GATEWAY = "192.168.1.1"
DNS1 = "192.168.1.10"
DNS2 = "192.168.1.11"
MACCSV=subprocess.check_output("esxcli --formatter=csv network nic list",shell=True).decode("utf-8").split(',')

with open("/vmfs/volumes/datastore1/hosts.csv", mode="r", encoding="utf-8") as f:
        reader = csv.reader(f)
        for row in reader:
                if row[1].lower() in MACCSV:
                        #name of server
                        print(row[1])
                        os.system("esxcli system hostname set --fqdn=" + row[0])
                        #vlan tag
                        os.system("esxcli network vswitch standard portgroup set --portgroup-name=\"Management Network\" --vlan-id=108")
                        #ipadd
                        os.system("esxcli network ip interface ipv4 set --interface-name=vmk0 --ipv4=" + row[2] + " " + "--netmask=" + row[3] + " --type=static")
                        os.system("esxcli network ip set --ipv6-enabled=false")
                        os.system("esxcli network ip route ipv4 add --gateway=" + GATEWAY + " -n=default")
                        #domain
                        os.system("esxcli network ip dns search add --domain dcops.army.mil")
                        os.system("esxcli network ip dns server remove --all")
                        os.system("esxcli network ip dns server add --server=" + DNS1)
                        os.system("esxcli network ip dns server add --server=" + DNS2)
                else:
                        print("no match found for host")
print ("End of cutomization script")
EOF

# Now its time to execute the script we just created above
%firstboot --interpreter=busybox
# Give enough time for above tasks to take place
sleep 30;

# Make it executable and execute
chmod u+x /vmfs/volumes/datastore1/myscript.py
/bin/python /vmfs/volumes/datastore1/myscript.py
# Just a little time to make sure settings apply
sleep 8;

# Ensure the ESXi don't loose any custom config upon next reboot
/sbin/auto-backup.sh
# Clean Up
rm -f /vmfs/volumes/datastore1/myscript.py || echo "manual cleanup required"
rm -f /vmfs/volumes/datastore1/hosts.csv || echo "manual cleanup required"
